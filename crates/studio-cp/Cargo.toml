[package]
name = "studio-cp"
version = "0.1.0"
edition = "2021"
description = "Studio control-plane — consumes oabctl (management/status) and maps it onto the agent-lifecycle model"
license = "MIT"

[dependencies]
oabctl = { path = "../oabctl" }
agent-lifecycle = { path = "../agent-lifecycle" }
studio-compose = { path = "../studio-compose" }
aws-config = "1.5"
aws-sdk-sts = "1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "6"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }
