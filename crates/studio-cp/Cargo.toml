[package]
name = "studio-cp"
version = "0.1.0"
edition = "2021"
description = "Studio control-plane — consumes oabctl (management/status) and maps it onto the agent-lifecycle model"
license = "MIT"

[dependencies]
oabctl = { path = "../oabctl" }
agent-lifecycle = { path = "../agent-lifecycle" }
studio-compose = { path = "../studio-compose" }
aws-config = "1.5"
aws-sdk-sts = "1"
kube = { version = "0.99", default-features = false, features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.24", features = ["latest"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "6"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }
# studio#119: mints GKE bearer tokens in-process (same ADC credential chain
# `gke-gcloud-auth-plugin` itself reads) instead of shelling out to that
# plugin — sidesteps the GUI-app PATH-visibility problem entirely for GKE
# specifically (fix-path-env in src-tauri still covers other exec-based
# providers like Azure kubelogin, which has no equivalent crate).
gcp_auth = "0.12"
# Only needed to construct `kube::config::AuthInfo.token` (a
# `SecretBox<str>`) directly. Pinned to match kube 0.99's own resolved
# `secrecy` version (0.10.x) so the types actually unify — kube::config
# doesn't re-export the type.
secrecy = "0.10"
# studio#119 follow-up: generates the OPENAB_ACP_AUTH_KEY value + the JSON
# secret blob it's stored as (same convention `oabctl create`'s CLI wizard
# uses for the Discord bot token).
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
aws-sdk-secretsmanager = "1"
