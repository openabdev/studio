[package]
name = "studio-desktop"
version = "0.1.0"
description = "OAB Studio desktop console (Tauri shell) — ADR-3 slice-2"
authors = ["OpenAB"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"

# The desktop reaches the control-plane core over the MCP contract, spawning the
# bundled `oab-mcp` sidecar (ADR: desktop-core-sidecar) — no in-process link to
# studio-cp / aws-config. Shell plugin bundles + spawns the sidecar; tokio sync
# primitives multiplex JSON-RPC requests over its stdio.
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "net", "time"] }

# Reverse-MCP-over-ACP (reverse-MCP client ADR, Part B): the pure protocol +
# session state machine + remote-connection config live in `acp-tunnel`; the WS
# transport here dials `/acp` and relays tunnelled MCP to the sidecar `McpClient`.
acp-tunnel = { path = "../crates/acp-tunnel" }

# Bundle composition (ADR: agent deployment, slice 1): the pure `template ⊕ overlay
# → {path → bytes}` compose seam. No AWS/runtime here — the desktop authors the
# library + previews the composed bundle; the provider drivers (slice 2+) consume a
# `Bundle`.
studio-compose = { path = "../crates/studio-compose" }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
dirs = "5"

# Remote upgrade (ADR: remote-upgrade): the installed app pulls a signed nightly
# bundle from the GitHub release and replaces itself in place. Driven from Rust
# (custom commands below), so the web skin stays free of the updater JS package.
tauri-plugin-updater = "2"

# GUI-launched apps don't inherit the user's shell-rc PATH (studio#119) —
# re-reads it from a login shell at startup so exec-based kubeconfig auth
# plugins installed via Homebrew/etc. are actually found. Not published to
# crates.io (upstream ships it as a plain git crate); pinned to a specific
# commit rather than the floating `dev` branch for reproducibility.
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }

# Native folder-picker dialog (studio#128) — lets the operator choose the
# local "Config folder" the New Fleet wizard mirrors generated config.toml
# files into, instead of a hidden hardcoded path.
tauri-plugin-dialog = "2"

# Its own workspace so the desktop build stays out of the root workspace's
# `cargo build --workspace` (kept to the small crates + CI).
[workspace]
