<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAB Studio — Console</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">OAB <span>Studio</span></div>
      <div class="meta">
        <span class="cluster" id="cluster-label"></span>
        <span class="status" id="poll-status"></span>
      </div>
    </header>
    <main class="content">
      <section class="logpane">
        <div class="pane-title">Activity</div>
        <div id="log" class="log"></div>
      </section>
      <section class="logpane">
        <div class="pane-title">MCP · oab-mcp</div>
        <div id="mcpio" class="log mcpio"></div>
      </section>
      <section id="roster" class="roster-wrap"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
