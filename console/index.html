<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAB Studio — Console</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">OAB <span>Studio</span>
        <span class="build" id="build-info"></span>
      </div>
      <div class="meta">
        <span class="cluster" id="cluster-label"></span>
        <span class="status" id="poll-status"></span>
        <button class="update-btn" id="update-btn" hidden>檢查更新</button>
      </div>
    </header>
    <main class="content">
      <section id="identity" class="identity-wrap"></section>
      <section class="logs">
        <nav class="tabs" id="tabs">
          <button class="tab is-active" data-target="log">Activity</button>
          <button class="tab" data-target="mcpio">MCP · oab-mcp</button>
        </nav>
        <div id="log" class="log pane"></div>
        <div id="mcpio" class="log pane mcpio" hidden></div>
      </section>
      <section id="roster" class="roster-wrap"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
