<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAB Studio — Console</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">OAB <span>Studio</span>
        <span class="build" id="build-info"></span>
      </div>
      <div class="meta">
        <span class="cluster" id="cluster-label"></span>
        <span class="status" id="poll-status"></span>
        <button class="update-btn" id="update-btn" hidden>Check for updates</button>
      </div>
    </header>
    <main class="content">
      <section id="config" class="config-wrap"></section>
      <section id="config-editor" class="cfg-editor-wrap" hidden>
        <div class="cfg-editor-head">
          <span class="cfg-label" id="cfg-editor-title">edit fleets.toml</span>
          <span class="cfg-editor-path" id="cfg-editor-path"></span>
          <span class="cfg-editor-spacer"></span>
          <button class="cfg-btn" id="cfg-save" type="button">Save</button>
          <button class="cfg-btn cfg-btn-ghost" id="cfg-cancel" type="button">Cancel</button>
        </div>
        <div id="cfg-editor-mount" class="cfg-editor-mount"></div>
        <div class="cfg-editor-error" id="cfg-editor-error" hidden></div>
      </section>
      <section id="identity" class="identity-wrap"></section>
      <section id="remote" class="remote-wrap"></section>
      <section id="chat" class="chat-wrap">
        <div class="chat-head">
          <span class="chat-title">Agent chat</span>
          <span class="chat-conn" id="chat-conn">disconnected</span>
        </div>
        <div id="chat-log" class="chat-log"></div>
        <form id="chat-form" class="chat-input">
          <textarea id="chat-text" class="chat-text" rows="2" placeholder="Message the agent…  (Enter to send · Shift+Enter for a newline)"></textarea>
          <div class="chat-actions">
            <button type="button" id="chat-stop" class="chat-btn chat-stop" hidden>Stop</button>
            <button type="submit" id="chat-send" class="chat-btn chat-send">Send</button>
          </div>
        </form>
      </section>
      <section class="logs">
        <nav class="tabs" id="tabs">
          <button class="tab is-active" data-target="log">Activity</button>
          <button class="tab" data-target="mcpio">MCP · oab-mcp</button>
          <button class="tab" data-target="config">Config</button>
        </nav>
        <div id="log" class="log pane"></div>
        <div id="mcpio" class="log pane mcpio" hidden></div>
        <div id="config" class="pane config" hidden>
          <form id="config-form" class="config-form" autocomplete="off">
            <label
              >Cluster
              <input
                id="cfg-cluster"
                name="cluster"
                type="text"
                placeholder="oab"
                spellcheck="false"
              />
            </label>
            <label
              >AWS profile
              <input
                id="cfg-profile"
                name="profile"
                type="text"
                placeholder="e.g. brettchien"
                spellcheck="false"
              />
            </label>
            <label
              >AWS region
              <input
                id="cfg-region"
                name="region"
                type="text"
                placeholder="e.g. ap-east-2"
                spellcheck="false"
              />
            </label>
            <div class="config-actions">
              <button type="submit" id="cfg-save">Save &amp; reload core</button>
              <span class="config-status" id="cfg-status"></span>
            </div>
            <p class="config-hint">
              Pins the oab-mcp sidecar to this profile / region (a hermetic env, so
              no ambient AWS credentials leak in) and reloads the core. Leaving
              profile or region blank means the sidecar has no AWS identity — an
              explicit auth error, not a silent drift.
            </p>
          </form>
        </div>
      </section>
      <section id="roster" class="roster-wrap"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
