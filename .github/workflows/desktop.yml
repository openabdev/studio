name: desktop

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "console/**"
      - "crates/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "console/**"
      - "crates/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS is the only shipped target for now, so we compile/bundle only on osx.
  # The Linux compile-validation stage (a fast Rust gate that `cargo build`s the
  # desktop shell on ubuntu) is disabled for now — re-enable it by reverting this
  # change when a Linux / universal target is on the roadmap. The macOS bundle
  # below still compiles `src-tauri` via `tauri build`, so the Rust bridge is
  # covered.
  #
  # Bundle the macOS app on GitHub's free macOS runner (public repo).
  # Native arm64, UNSIGNED for now (Gatekeeper: right-click → Open, or
  # `xattr -dr com.apple.quarantine`). The `oab-mcp` core is bundled as a
  # sidecar and spawned by the app at launch. Universal + code-signing + updater
  # are follow-ons. Artifact = the .dmg to download and run.
  bundle-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the web skin
        run: |
          npm --prefix console ci
          npm --prefix console run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache's key hashes Cargo.lock (+ rustc + cargo config) but NOT
          # the [profile.*] sections of Cargo.toml. So adding `release-ci` in #51
          # did not change the key: every run got a "full match" against the old
          # v0 cache — which only held deps built under `release/`, never
          # `release-ci/`. `cargo build --profile release-ci` therefore recompiled
          # the whole aws-sdk/aws-lc-sys tree cold (~20m) every run, and since the
          # key matched, the post step said "Cache up-to-date" and saved nothing
          # (GitHub keys are immutable) — so the release-ci deps never persisted.
          #
          # prefix-key bump = one-time reset off the poisoned v0 cache.
          # key: hashFiles('Cargo.toml') folds the profile-defining manifest into
          # the cache key, so any future profile edit auto-mints a fresh key and
          # self-heals — no need to remember to bump prefix-key by hand again.
          prefix-key: "v1-rust"
          key: ${{ hashFiles('Cargo.toml') }}
          workspaces: |
            . -> target
            src-tauri -> target
      - name: Build oab-mcp sidecar (arm64)
        # release-ci profile (root Cargo.toml): opt-level 1 + codegen-units 256,
        # so the aws-sdk/aws-lc-sys tree compiles in minutes, not ~23. The sidecar
        # is I/O-bound (AWS API calls), so it doesn't need full release opt.
        run: |
          cargo build --profile release-ci -p oab-mcp --target aarch64-apple-darwin
          mkdir -p src-tauri/binaries
          cp target/aarch64-apple-darwin/release-ci/oab-mcp \
            src-tauri/binaries/oab-mcp-aarch64-apple-darwin
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2
      - name: Bundle (.app + .dmg)
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build --target aarch64-apple-darwin
      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: studio-macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 7
