name: desktop

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "console/**"
      - "crates/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "console/**"
      - "crates/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS is the only shipped target for now, so we compile/bundle only on osx.
  # The Linux compile-validation stage (a fast Rust gate that `cargo build`s the
  # desktop shell on ubuntu) is disabled for now — re-enable it by reverting this
  # change when a Linux / universal target is on the roadmap. The macOS bundle
  # below still compiles `src-tauri` via `tauri build`, so the Rust bridge is
  # covered.
  #
  # Bundle the macOS app on GitHub's free macOS runner (public repo).
  # Native arm64, UNSIGNED for now (Gatekeeper: right-click → Open, or
  # `xattr -dr com.apple.quarantine`). The `oab-mcp` core is bundled as a
  # sidecar and spawned by the app at launch. Universal + code-signing + updater
  # are follow-ons. Artifact = the .dmg to download and run.
  bundle-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the web skin
        run: |
          npm --prefix console ci
          npm --prefix console run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          # prefix-key is bumped to v1 to force a fresh cache slot. rust-cache's
          # key hashes Cargo.lock (+ rustc + cargo config) but NOT the
          # [profile.*] sections of Cargo.toml, so adding `release-ci` in #51 did
          # not change the key. Every run kept getting a "full match" against the
          # pre-existing v0 cache — which only held deps built under `release/`,
          # never `release-ci/`. So `cargo build --profile release-ci` recompiled
          # the whole aws-sdk/aws-lc-sys tree cold (~20m) every time, and the post
          # step reported "Cache up-to-date" and saved nothing (GitHub keys are
          # immutable). Bumping the prefix mints a new key: the first run misses,
          # does the cold build, and actually SAVES the release-ci deps. After
          # that, unrelated PRs restore those deps and cargo's own fingerprinting
          # recompiles only oab-mcp itself — minutes, as intended in #51.
          prefix-key: "v1-rust"
          workspaces: |
            . -> target
            src-tauri -> target
      - name: Build oab-mcp sidecar (arm64)
        # release-ci profile (root Cargo.toml): opt-level 1 + codegen-units 256,
        # so the aws-sdk/aws-lc-sys tree compiles in minutes, not ~23. The sidecar
        # is I/O-bound (AWS API calls), so it doesn't need full release opt.
        run: |
          cargo build --profile release-ci -p oab-mcp --target aarch64-apple-darwin
          mkdir -p src-tauri/binaries
          cp target/aarch64-apple-darwin/release-ci/oab-mcp \
            src-tauri/binaries/oab-mcp-aarch64-apple-darwin
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2
      - name: Bundle (.app + .dmg)
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build --target aarch64-apple-darwin
      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: studio-macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 7
